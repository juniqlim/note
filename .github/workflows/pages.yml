name: 배포

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 앞선 것을 죽이지 않는다 — 중간 상태로 사이트가 남는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 쓴 날·고친 날을 git 이력에서 읽는다. 얕게 받으면 128편이 모두 같은 날이 된다.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 테스트가 깨지면 배포하지 않는다.
      - run: npm test
      - run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
